# Requires kitty 0.49 or newer.
# Copy shaders/kitty/nyan.slang and shaders/kitty/nyan.pipeline into
# ~/.config/kitty/shaders/, then add these settings to kitty.conf.

cursor_trail 1
cursor_trail_start_threshold 2 2
custom_shaders nyan

# Recommended: cursor blinking competes visually with the procedural cat.
cursor_blink_interval 0
