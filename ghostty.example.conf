# Drop these lines into your Ghostty config:
#   macOS: ~/Library/Application Support/com.mitchellh.ghostty/config
#   Linux: ~/.config/ghostty/config
#
# Update the `custom-shader` path to wherever you installed nyan.glsl.

# Procedural nyan cat cursor with rainbow trail.
# Animation MUST stay on so the legs wiggle and stars shimmer while
# the trail is fading out — without it the cat freezes.
custom-shader = ~/Library/Application Support/com.mitchellh.ghostty/shaders/nyan.glsl
custom-shader-animation = true

# Recommended companion settings.
# OS-level cursor blink on top of the procedural cat looks broken — the
# shader handles its own fade-in/fade-out around cursor movement.
cursor-style = block
cursor-style-blink = false
